name: FlowForge CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore FlowForge.Api/FlowForge.Api.csproj

    - name: Build
      run: dotnet build FlowForge.Api/FlowForge.Api.csproj --no-restore --configuration Release

    # We will add a 'dotnet test' step here once we write our first unit tests.

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Using LTS
        cache: 'npm'
        cache-dependency-path: './src/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Type Check & Build
      run: npm run build